name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} — lint, phpcs, phpunit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, dom, curl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: PHPCS (WordPress-Core/Docs/Extra + Security + PHPCompatibilityWP)
        run: vendor/bin/phpcs --standard=phpcs.xml.dist -q --report=summary

      - name: PHPUnit (unit)
        run: vendor/bin/phpunit -c tests/phpunit.xml.dist

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install runtime dependencies only
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress
      - name: Run plugin check
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: 'vendor,tests,node_modules'
